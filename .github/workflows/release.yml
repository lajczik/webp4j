name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  JAVA_VERSION: '21'

jobs:
  # ============================================
  # Build native libraries (reusable workflow)
  # ============================================
  build-natives:
    name: Build Native Libraries
    uses: ./.github/workflows/build-natives.yml

  # ============================================
  # Publish to Maven Central
  # ============================================
  publish-maven:
    name: Publish to Maven Central
    runs-on: ubuntu-latest
    needs: build-natives

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup Java for Maven Central
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}
        gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
        gpg-passphrase: GPG_PASSPHRASE

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Download all native artifacts
      uses: actions/download-artifact@v5
      with:
        name: webp4j-all-platforms
        path: src/main/resources/native

    - name: Display native libraries
      run: |
        echo "Native files:" && ls -lh src/main/resources/native || true

    - name: Build and package JAR
      run: |
        ./gradlew jar sourcesJar javadocJar -x test
        echo "JAR contents:" && jar tf build/libs/webp4j-core-*.jar | grep native/ || true

    - name: Publish to Maven Central
      env:
        OSSRH_USERNAME: ${{ secrets.OSSRH_USERNAME }}
        OSSRH_PASSWORD: ${{ secrets.OSSRH_PASSWORD }}
        ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_PRIVATE_KEY }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
      run: |
        ./gradlew publish -x test

  # ============================================
  # Create GitHub Release
  # ============================================
  create-release:
    name: Create GitHub Release
    needs: publish-maven
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')  # Only when tag is pushed

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Extract version without 'v' prefix
      id: version
      run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

    - name: Setup Java
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: ${{ env.JAVA_VERSION }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Download all native artifacts
      uses: actions/download-artifact@v5
      with:
        name: webp4j-all-platforms
        path: src/main/resources/native

    - name: Display native libraries
      run: |
        echo "Native files:" && ls -lh src/main/resources/native || true

    - name: Build JAR with all native libraries
      run: |
        ./gradlew jar sourcesJar javadocJar -x test
        echo "JAR contents:" && jar tf build/libs/webp4j-core-*.jar | grep native/ || true

    - name: Prepare release files
      run: |
        mkdir -p release-files
        cp build/libs/webp4j-core-*.jar release-files/ 2>/dev/null || true
        cd release-files
        sha256sum *.jar > SHA256SUMS 2>/dev/null || true
        cat SHA256SUMS

    - name: Create Release
      uses: softprops/action-gh-release@v2
      with:
        files: release-files/*
        generate_release_notes: true
        draft: false
        prerelease: false
        body: |
          ## WebP4j Release

          ### What's Changed
          - **Gradle 9.8.1 Build System** — Migrated to Gradle wrapper and Multi-Release JAR packaging.
          - **Java 22+ Foreign Function & Memory (FFM) API** — Direct C ABI downcalls via `java.lang.foreign` for zero-copy encode/decode on modern Java.
          - **Lombok Integration** — Streamlined models and configuration.
          - **Container Parsing in Java** — WebP RIFF chunk container parsing and framing moved to Java.

          ### Installation

          **Maven:**
          ```xml
          <dependency>
            <groupId>dev.matrixlab.webp4j</groupId>
            <artifactId>webp4j-core</artifactId>
            <version>${{ steps.version.outputs.VERSION }}</version>
          </dependency>
          ```

          **Gradle:**
          ```gradle
          implementation 'dev.matrixlab.webp4j:webp4j-core:${{ steps.version.outputs.VERSION }}'
          ```

          ### Supported Platforms
          - Windows x64
          - Windows ARM64 (aarch64)
          - macOS x64 (Intel)
          - macOS arm64 (Apple Silicon)
          - Linux x64
          - Linux ARM64 (aarch64)
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
